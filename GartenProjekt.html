<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Meine A-Frame Szene</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      #wetterKnopf { position: fixed; z-index: 10; top: 18px; right: 18px; padding: 12px 18px; border: 2px solid #fff; border-radius: 24px; background: #29455fdd; color: white; font: 600 16px Arial; cursor: pointer; box-shadow: 0 4px 14px #0006; }
      #wetterKnopf:hover { background: #3b6385; transform: translateY(-1px); }
    </style>
  </head>

    <button id="wetterKnopf" type="button" aria-pressed="false">🌧 Gewitter starten</button>

        <img id="sunTextur" src="https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/sunmap.jpg" crossorigin="anonymous">
      </a-assets>

    <script>
      (function () {
        // Klont eine Vorlage in einen Halter, der Standort, Drehung und Groesse setzt
        function klonen(vorlage, ziel, pos, drehung, groesse) {
          var halter = document.createElement('a-entity');
          halter.setAttribute('position', pos);
          halter.setAttribute('rotation', '0 ' + drehung + ' 0');
          halter.setAttribute('scale', groesse + ' ' + groesse + ' ' + groesse);
          var kopie = vorlage.cloneNode(true);
          kopie.removeAttribute('id');
          kopie.setAttribute('position', '0 0 0');
          halter.appendChild(kopie);
          ziel.appendChild(halter);
          return kopie;
        }
        // Niedriger Holzzaun mit einem Eingang an der Vorderseite
        function zaunBauen() {
          var zaun = document.getElementById('zaun');
          function teil(tag, position, groesse, farbe) {
            var el = document.createElement(tag);
            el.setAttribute('position', position);
            el.setAttribute('color', farbe || '#76502F');
            el.setAttribute('shadow', 'cast: true; receive: true');
            Object.keys(groesse).forEach(function (a) { el.setAttribute(a, groesse[a]); });
            zaun.appendChild(el);
          }
          function pfosten(x, z, i) {
            var farbe = i % 2 ? '#704827' : '#805936';
            teil('a-box', x + ' 0.52 ' + z, {width: 0.2, height: 1.04, depth: 0.2}, farbe);
            teil('a-cone', x + ' 1.12 ' + z, {'radius-bottom': 0.15, 'radius-top': 0, height: 0.22, 'segments-radial': 4}, farbe);
          }
          [[-7.9, 4.5, 12.2, 0.14], [7.9, 4.5, 12.2, 0.14], [0, -16.5, 28, 0.14],
           [-14, -6, 0.14, 21], [14, -6, 0.14, 21]].forEach(function (r) {
            [0.34, 0.72].forEach(function (y) { teil('a-box', r[0] + ' ' + y + ' ' + r[1], {width: r[2], height: 0.12, depth: r[3]}, '#855B35'); });
          });
          var i = 0;
          for (var x = -14; x <= 14; x += 2.8) { pfosten(x, -16.5, i++); if (Math.abs(x) > 1.7) { pfosten(x, 4.5, i++); } }
          [-14, 14].forEach(function (x) { for (var z = -13.5; z <= 1.5; z += 3) { pfosten(x, z, i++); } });
          pfosten(-1.8, 4.5, i++); pfosten(1.8, 4.5, i);
        }
        // Zufallsplatz auf der Wiese, Blumenbereich und Brunnen bleiben frei
        function platzSuchen() {
          for (var v = 0; v < 12; v++) {
            var x = (Math.random() - 0.5) * 25;
            var z = Math.random() * 18 - 15;
            var beetFrei = Math.abs(x) > 4.5 || z < -3.5 || z > 0.2;
            var brunnenFrei = (x - 4.8) ** 2 + (z + 5.2) ** 2 > 8;
            if (beetFrei && brunnenFrei) { return x.toFixed(2) + ' 0 ' + z.toFixed(2); }
          }
          return null;
        }
        function bepflanzen() {
          var baum = document.getElementById('baum');
          var baeume = document.getElementById('baumgruppe');
          var beet = document.getElementById('beet');
          var wiese = document.getElementById('wiesenblumen');
          var wolke = document.getElementById('wolke');
          var wolken = document.getElementById('wolken');
          if (!baum || !baeume || !beet || !wiese || !wolke || !wolken) { return; }
          zaunBauen();
          [[6, 15, -7, 0.9], [-11, 17, -13, 1.15], [1, 19, -17, 1.25], [11, 17, -14, 1.05], [-3, 21, -22, 1.2]]
            .forEach(function (p, i) { klonen(wolke, wolken, p[0] + ' ' + p[1] + ' ' + p[2], -12 + i * 7, p[3]); });
          // Baeume ringsum
          [[-9, -4.4], [8.6, -2.8], [3.2, -12.4], [7.2, 2.6], [-12.2, -9.4]]
            .forEach(function (p, i) {
              var kopie = klonen(baum, baeume, p[0] + ' 0 ' + p[1], i * 47, 0.85 + (i % 5) * 0.11);
              var dauer = 4600 + i * 320;
              kopie.setAttribute('animation', 'property: rotation; from: 0 0 -0.9; to: 0 0 0.9; dir: alternate; loop: true; dur: ' + dauer + '; delay: ' + i * 430 + '; easing: easeInOutSine');
              var krone = kopie.querySelector('.baumkrone');
              if (krone) {
                krone.setAttribute('animation', 'property: rotation; from: 0 -2.4 -1.4; to: 0 2.4 1.4; dir: alternate; loop: true; dur: ' + (dauer - 700) + '; delay: ' + (i * 430 + 200) + '; easing: easeInOutSine');
              }
            });
          // Blumen aus dem Beet ueber die Wiese streuen
          var vorlagen = beet.querySelectorAll(':scope > a-entity');
          for (var i = 0; i < 110; i++) {
            var pos = platzSuchen();
            if (!pos) { continue; }
            klonen(vorlagen[i % vorlagen.length], wiese, pos, Math.round(Math.random() * 360), 0.55 + Math.random() * 0.5);
          }
        }
        // Regen wird kompakt erzeugt; WetterWert 0..1 steuert den weichen Uebergang
        var gewitter = false, blitzTimer, wetterWert = 0, wetterAnimation;
        function regenBauen() {
          var regen = document.getElementById('regen');
          for (var i = 0; i < 180; i++) {
            var tropfen = document.createElement('a-cylinder');
            var x = Math.random() * 30 - 15, y = Math.random() * 18 + 3, z = Math.random() * 24 - 18;
            tropfen.setAttribute('position', x + ' ' + y + ' ' + z);
            tropfen.setAttribute('radius', '0.012');
            tropfen.setAttribute('height', '0.42');
            tropfen.setAttribute('material', 'color: #BDEBFF; transparent: true; opacity: 0; shader: flat');
            tropfen.setAttribute('animation', 'property: position; to: ' + x + ' -0.3 ' + z + '; dur: ' + (650 + Math.random() * 450) + '; loop: true; easing: linear; delay: ' + Math.random() * 900);
            regen.appendChild(tropfen);
          }
        }
        function blitzen() {
          if (!gewitter) { return; }
          var licht = document.getElementById('blitzlicht');
          licht.setAttribute('light', 'intensity', 4.5);
          setTimeout(function () { licht.setAttribute('light', 'intensity', 0); }, 90);
          setTimeout(function () {
            if (gewitter && Math.random() > 0.45) {
              licht.setAttribute('light', 'intensity', 2.8);
              setTimeout(function () { licht.setAttribute('light', 'intensity', 0); }, 70);
            }
          }, 170);
          blitzTimer = setTimeout(blitzen, 1800 + Math.random() * 4200);
        }
        function wetterDarstellen(wert) {
          function farbe(von, zu) { return '#' + new THREE.Color(von).lerp(new THREE.Color(zu), wert).getHexString(); }
          document.getElementById('szene').setAttribute('fog', 'type: exponential; color: ' + farbe('#87CEEB', '#607080') + '; density: ' + (0.0002 + 0.0448 * wert));
          document.getElementById('himmel').setAttribute('color', farbe('#87CEEB', '#465665'));
          document.getElementById('sonnenlicht').setAttribute('light', 'intensity', 1.4 - 1.05 * wert);
          document.getElementById('umgebungslicht').setAttribute('light', 'intensity', 0.65 - 0.33 * wert);
          document.getElementById('regen').object3D.traverse(function (o) { if (o.material) { o.material.opacity = 0.72 * wert; } });
          [document.getElementById('wolke'), document.getElementById('wolken')].forEach(function (el) {
            el.object3D.traverse(function (o) { if (o.material) { o.material.color.set(farbe('#FFFFFF', '#65717C')); } });
          });
        }
        function wetterUmschalten() {
          gewitter = !gewitter;
          var ziel = gewitter ? 1 : 0, startWert = wetterWert, startZeit = performance.now();
          var dauer = 4500 * Math.abs(ziel - startWert), knopf = document.getElementById('wetterKnopf');
          cancelAnimationFrame(wetterAnimation);
          clearTimeout(blitzTimer);
          document.getElementById('blitzlicht').setAttribute('light', 'intensity', 0);
          document.getElementById('regen').setAttribute('visible', true);
          knopf.disabled = true;
          knopf.textContent = gewitter ? '🌦 Gewitter zieht auf …' : '🌤 Wetter klart auf …';
          function uebergang(zeit) {
            var p = Math.min(1, (zeit - startZeit) / Math.max(1, dauer));
            var weich = p * p * (3 - 2 * p);
            wetterWert = startWert + (ziel - startWert) * weich;
            wetterDarstellen(wetterWert);
            if (p < 1) { wetterAnimation = requestAnimationFrame(uebergang); return; }
            if (!gewitter) {
              document.getElementById('regen').setAttribute('visible', false);
              document.getElementById('szene').setAttribute('fog', 'type: linear; color: #87CEEB; near: 120; far: 700');
            } else { blitzen(); }
            knopf.disabled = false;
            knopf.textContent = gewitter ? '☀ Schönes Wetter' : '🌧 Gewitter starten';
            knopf.setAttribute('aria-pressed', String(gewitter));
          }
          wetterAnimation = requestAnimationFrame(uebergang);
        }
        regenBauen();
        document.getElementById('wetterKnopf').addEventListener('click', wetterUmschalten);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bepflanzen);
        } else {
          bepflanzen();
        }
      })();
    </script>
  </body>
</html>
