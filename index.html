<!DOCTYPE html>

<html>

  <head>

    <meta charset="utf-8">

    <title>Meine A-Frame Szene</title>

    <!-- A-Frame -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  </head>

  <body>

    <a-scene shadow="type: pcfsoft" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true">

      <!-- Bodentextur -->

      <a-assets>

        <img id="grassTextur"

             src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/terrain/grasslight-big.jpg"

             crossorigin="anonymous">

      </a-assets>



      <!-- Baum -->

      <a-entity position="0 0 -3">


        <a-cone position="0 0.11 0" radius-bottom="0.40" radius-top="0.27" height="0.22"

                segments-radial="14" color="#6B4A2F" roughness="1" metalness="0"

                shadow="cast: true; receive: true"></a-cone>


        <a-cone position="0 1.0 0" radius-bottom="0.27" radius-top="0.13" height="2.0"

                segments-radial="14" color="#75512F" roughness="1" metalness="0"

                shadow="cast: true; receive: true"></a-cone>


        <a-entity position="0 1.55 0" rotation="0 25 -38">

          <a-cone position="0 0.40 0" radius-bottom="0.09" radius-top="0.04" height="0.80"

                  segments-radial="8" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

          <a-entity position="0 0.78 0" rotation="0 -30 -22">

            <a-cone position="0 0.25 0" radius-bottom="0.045" radius-top="0.02" height="0.50"

                    segments-radial="6" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

          </a-entity>

        </a-entity>



        <a-entity position="0 1.70 0" rotation="0 -145 34">

          <a-cone position="0 0.38 0" radius-bottom="0.085" radius-top="0.035" height="0.76"

                  segments-radial="8" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

          <a-entity position="0 0.74 0" rotation="0 40 20">

            <a-cone position="0 0.22 0" radius-bottom="0.04" radius-top="0.018" height="0.44"

                    segments-radial="6" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

          </a-entity>

        </a-entity>



        <a-entity position="0 1.85 0" rotation="0 95 -26">

          <a-cone position="0 0.33 0" radius-bottom="0.07" radius-top="0.03" height="0.66"

                  segments-radial="8" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

        </a-entity>



        <a-entity position="0 1.90 0" rotation="0 -60 28">

          <a-cone position="0 0.30 0" radius-bottom="0.065" radius-top="0.028" height="0.60"

                  segments-radial="8" color="#704B2C" roughness="1" shadow="cast: true"></a-cone>

        </a-entity>



        <!-- "Blätter" Baum -->

        <a-entity position="0 2.55 0" shadow="cast: true">

          <a-sphere position="0 0 0" radius="0.95" scale="1.15 0.88 1.1"

                    color="#3F7F42" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="0.62 -0.22 0.34" radius="0.62" scale="1.1 0.9 1.05"

                    color="#427F46" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="-0.66 -0.20 -0.24" radius="0.60" scale="1.05 0.92 1.1"

                    color="#3A7640" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="-0.30 -0.12 0.66" radius="0.58" scale="1.1 0.9 1"

                    color="#457F48" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="0.34 -0.10 -0.70" radius="0.56" scale="1 0.9 1.08"

                    color="#3C7A41" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="0.20 0.48 0.10" radius="0.62" scale="1.08 0.85 1.05"

                    color="#4A8A4D" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="-0.26 0.42 -0.18" radius="0.55" scale="1.05 0.85 1.08"

                    color="#487F4A" roughness="1" metalness="0"></a-sphere>

          <a-sphere position="0.05 -0.52 0.05" radius="0.66" scale="1.15 0.7 1.12"

                    color="#356E39" roughness="1" metalness="0"></a-sphere>

        </a-entity>

      </a-entity>



      <!-- Blumenbeet mit Rosen, Lavendel, Tulpen und Sonnenblumen -->
      <a-entity position="0 0 -1.8">
        <!-- Rosen -->
        <a-entity position="-2.2 0 0.15">
          <a-cylinder position="0 0.52 0" radius="0.035" height="1.05" color="#3E733D" shadow="cast: true"></a-cylinder>
          <a-sphere position="0 1.08 0" radius="0.16" color="#D94B61" shadow="cast: true"></a-sphere>
          <a-sphere position="-0.09 1.12 0.02" radius="0.12" color="#F07A87"></a-sphere>
          <a-sphere position="0.09 1.12 0.02" radius="0.12" color="#C83250"></a-sphere>
          <a-sphere position="0 1.19 0.04" radius="0.09" color="#F59AA2"></a-sphere>
          <a-sphere position="0 0.58 0" radius="0.16" scale="1 0.08 1.8" rotation="0 0 28" color="#4C9149"></a-sphere>
          <a-sphere position="0 0.75 0" radius="0.15" scale="1 0.08 1.8" rotation="0 0 -32" color="#39783D"></a-sphere>
        </a-entity>
        <a-entity position="-1.45 0 -0.05" scale="0.82 0.82 0.82">
          <a-cylinder position="0 0.58 0" radius="0.035" height="1.15" color="#3E733D"></a-cylinder>
          <a-sphere position="0 1.18 0" radius="0.17" color="#E75C72" shadow="cast: true"></a-sphere>
          <a-sphere position="-0.1 1.2 0.02" radius="0.11" color="#F28B98"></a-sphere>
          <a-sphere position="0.1 1.2 0.02" radius="0.11" color="#C83D59"></a-sphere>
          <a-sphere position="0 1.27 0.03" radius="0.09" color="#F7A1AA"></a-sphere>
          <a-sphere position="0 0.7 0" radius="0.15" scale="1 0.08 1.8" rotation="0 0 -30" color="#4C9149"></a-sphere>
        </a-entity>

        <!-- Lavendel -->
        <a-entity position="-0.55 0 0.35">
          <a-cylinder position="0 0.34 0" radius="0.018" height="0.68" color="#5A874B"></a-cylinder>
          <a-cylinder position="-0.07 0.56 0" radius="0.055" height="0.28" color="#8D69B5"></a-cylinder>
          <a-cylinder position="0.07 0.67 0" radius="0.055" height="0.32" color="#A27AC7"></a-cylinder>
          <a-cylinder position="0 0.78 0" radius="0.05" height="0.25" color="#7651A2"></a-cylinder>
          <a-sphere position="-0.1 0.3 0" radius="0.12" scale="1 0.06 2" rotation="0 0 55" color="#6E9B55"></a-sphere>
          <a-sphere position="0.1 0.42 0" radius="0.12" scale="1 0.06 2" rotation="0 0 -55" color="#5B894A"></a-sphere>
        </a-entity>
        <a-entity position="-0.2 0 0.25" scale="0.85 0.85 0.85">
          <a-cylinder position="0 0.4 0" radius="0.018" height="0.8" color="#5A874B"></a-cylinder>
          <a-cylinder position="0 0.67 0" radius="0.06" height="0.34" color="#9470BE"></a-cylinder>
          <a-cylinder position="0 0.86 0" radius="0.05" height="0.27" color="#7651A2"></a-cylinder>
          <a-sphere position="-0.1 0.37 0" radius="0.12" scale="1 0.06 2" rotation="0 0 55" color="#6E9B55"></a-sphere>
          <a-sphere position="0.1 0.49 0" radius="0.12" scale="1 0.06 2" rotation="0 0 -55" color="#5B894A"></a-sphere>
        </a-entity>

        <!-- Tulpen -->
        <a-entity position="0.8 0 0.15">
          <a-cylinder position="0 0.48 0" radius="0.025" height="0.95" color="#4A883F"></a-cylinder>
          <a-cone position="0 1.02 0" radius-bottom="0.17" radius-top="0.09" height="0.28" color="#F28A35" segments-radial="8" shadow="cast: true"></a-cone>
          <a-sphere position="-0.11 0.56 0" radius="0.15" scale="1 0.07 1.9" rotation="0 0 52" color="#559748"></a-sphere>
          <a-sphere position="0.11 0.67 0" radius="0.15" scale="1 0.07 1.9" rotation="0 0 -50" color="#47863E"></a-sphere>
        </a-entity>
        <a-entity position="1.35 0 -0.05" scale="0.82 0.82 0.82">
          <a-cylinder position="0 0.5 0" radius="0.025" height="1" color="#4A883F"></a-cylinder>
          <a-cone position="0 1.08 0" radius-bottom="0.18" radius-top="0.1" height="0.3" color="#E65D75" segments-radial="8" shadow="cast: true"></a-cone>
          <a-sphere position="-0.11 0.6 0" radius="0.15" scale="1 0.07 1.9" rotation="0 0 50" color="#559748"></a-sphere>
          <a-sphere position="0.11 0.68 0" radius="0.15" scale="1 0.07 1.9" rotation="0 0 -50" color="#47863E"></a-sphere>
        </a-entity>

        <!-- Sonnenblumen -->
        <a-entity position="2.2 0 0.1">
          <a-cylinder position="0 0.7 0" radius="0.045" height="1.4" color="#477D3A" shadow="cast: true"></a-cylinder>
          <a-cylinder position="0 1.45 0" radius="0.24" height="0.08" color="#654323" rotation="90 0 0"></a-cylinder>
          <a-torus position="0 1.45 0" radius="0.29" radius-tubular="0.09" color="#F6B62F" rotation="90 0 0"></a-torus>
          <a-sphere position="-0.18 0.72 0" radius="0.2" scale="1 0.07 1.9" rotation="0 0 55" color="#60984B"></a-sphere>
          <a-sphere position="0.18 0.88 0" radius="0.2" scale="1 0.07 1.9" rotation="0 0 -55" color="#4D893E"></a-sphere>
        </a-entity>
        <a-entity position="2.75 0 -0.15" scale="0.78 0.78 0.78">
          <a-cylinder position="0 0.72 0" radius="0.045" height="1.45" color="#477D3A"></a-cylinder>
          <a-cylinder position="0 1.5 0" radius="0.23" height="0.08" color="#654323" rotation="90 0 0"></a-cylinder>
          <a-torus position="0 1.5 0" radius="0.28" radius-tubular="0.085" color="#F6C43A" rotation="90 0 0"></a-torus>
          <a-sphere position="-0.18 0.75 0" radius="0.2" scale="1 0.07 1.9" rotation="0 0 55" color="#60984B"></a-sphere>
        </a-entity>
      </a-entity>

     <!-- Sonne -->

      <a-entity position="-300 200 -100">

        <a-sphere radius="15" material="shader: flat; color: #FFF9C4"></a-sphere>

        <a-sphere radius="19" material="shader: flat; color: #FFEE58; transparent: true; opacity: 0.35; blending: additive; side: double"></a-sphere>

        <a-sphere radius="25" material="shader: flat; color: #FFD54F; transparent: true; opacity: 0.2; blending: additive; side: double"></a-sphere>

        <a-sphere radius="34" material="shader: flat; color: #FFC107; transparent: true; opacity: 0.1; blending: additive; side: double"></a-sphere>

      </a-entity>



      <!-- Sonnenlicht mit schatten -->

      <a-entity position="-7.5 5 -2.5"

                light="type: directional; color: #FFF4C2; intensity: 1.4; castShadow: true;

                       shadowMapWidth: 2048; shadowMapHeight: 2048;

                       shadowCameraLeft: -12; shadowCameraRight: 12;

                       shadowCameraTop: 12; shadowCameraBottom: -12;

                       shadowCameraNear: 0.5; shadowCameraFar: 40; shadowBias: -0.001"></a-entity>

     

      <!-- Umgebungslicht -->

      <a-light type="ambient" color="#93B6D6" intensity="0.65"></a-light>



      <!-- Boden mit Gras-Textur -->

      <a-plane position="0 0 -4"

               rotation="-90 0 0"

               width="30"

               height="30"

               material="src: #grassTextur; repeat: 12 12; roughness: 0.9"

               shadow="receive: true; cast: false">

      </a-plane>



      <!-- Himmel -->

      <a-sky color="#87CEEB"></a-sky>

    </a-scene>

  </body>

</html>
